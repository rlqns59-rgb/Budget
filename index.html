              아래 내용으로 <b>현재 데이터 전체를 덮어씁니다.</b> 되돌릴 수 없으니 확인 후 진행해주세요.
              {parsed.exportedAt && <div className="import-date">백업 시각: {new Date(parsed.exportedAt).toLocaleString('ko-KR')}</div>}
            </div>
            <div className="import-count-list">
              {rows.map(([label, arr]) => (
                <div key={label} className="import-count-row">
                  <span>{label}</span>
                  <span>{Array.isArray(arr) ? `${arr.length}건` : '—'}</span>
                </div>
              ))}
            </div>
          </>
        )}

        <div className="sheet-actions">
          <button className="btn-cancel" onClick={onClose}>취소</button>
          <button className="btn-save" disabled={!looksValid} onClick={onConfirm}>복원하기</button>
        </div>
      </div>
    </div>
  );
}

/* ---- 백업/복구 안내 시트 (Firestore 자동 백업 설정 가이드) ---- */
function BackupGuideSheet({ onManualBackup, onClose }) {
  const functionCode = `// functions/index.js — Firestore → Cloud Storage 자동 백업 (2세대 Cloud Functions)
const { onSchedule } = require('firebase-functions/v2/scheduler');
const { GoogleAuth } = require('google-auth-library');

exports.dailyFirestoreBackup = onSchedule(
  { schedule: '30 23 * * *', timeZone: 'Asia/Seoul' }, // 매일 밤 23:30 (한국시간)
  async () => {
    const projectId = process.env.GCLOUD_PROJECT;
    const auth = new GoogleAuth({ scopes: ['https://www.googleapis.com/auth/datastore'] });
    const client = await auth.getClient();
    await client.request({
      url: \`https://firestore.googleapis.com/v1/projects/\${projectId}/databases/(default):exportDocuments\`,
      method: 'POST',
      data: { outputUriPrefix: 'gs://YOUR_BACKUP_BUCKET/backups' }, // ← 백업용 버킷 이름으로 교체
    });
  }
);`;

  const deployCmd = `# 1) 백업 저장용 Storage 버킷 생성 (최초 1회)
gsutil mb -l asia-northeast3 gs://YOUR_BACKUP_BUCKET

# 2) Cloud Function 배포
firebase deploy --only functions:dailyFirestoreBackup`;

  const copy = (text) => navigator.clipboard?.writeText(text).catch(() => {});

  return (
    <div className="sheet-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet notion-sheet">
        <div className="sheet-handle" />
        <div className="sheet-title">⏰ 백업 / 복구</div>

        <div className="notion-status demo">
          🔧 아직 Firestore 연동 전이라 자동 백업은 준비 단계예요. 2단계(Firestore 연동) 이후 아래 설정을 한 번 해두면
          <b> 매일 밤 11:30(KST)</b> 자동으로 Firestore 전체가 백업돼요.
        </div>

        <div className="backup-section-label">지금 바로 되는 것 — 수동 백업(JSON)</div>
        <button className="btn-save" style={{ width: '100%', marginBottom: 16 }} onClick={onManualBackup}>
          지금 전체 데이터 JSON으로 백업
        </button>

        <div className="backup-section-label">자동 백업 설정 (Firestore 연동 후, 1회만)</div>
        <div className="backup-code-block">
          <div className="backup-code-head">
            <span>Cloud Function 코드</span>
            <button onClick={() => copy(functionCode)}>복사</button>
          </div>
          <pre>{functionCode}</pre>
        </div>
        <div className="backup-code-block">
          <div className="backup-code-head">
            <span>배포 명령어</span>
            <button onClick={() => copy(deployCmd)}>복사</button>
          </div>
          <pre>{deployCmd}</pre>
        </div>
        <div className="import-note">
          Cloud Scheduler + Cloud Functions는 Firebase <b>Blaze(종량제) 플랜</b>이 필요해요(개인 가계부 규모면 무료 한도 내로 거의 과금 없음).
          버킷 이름(YOUR_BACKUP_BUCKET)만 실제 이름으로 바꿔서 그대로 실행하면 돼요.
        </div>

        <div className="sheet-actions">
          <button className="btn-save" onClick={onClose}>닫기</button>
        </div>
      </div>
    </div>
  );
}

/* ---- 대시보드 홈 탭 본체 ---- */
function DashboardTab({ transactions, categories, budgets, incomes, debts, cardBills, shoppingItems, onNavigateTab, onExportAllJson, onImportAllJson }) {
  const now = new Date();
  const [ym, setYm] = useState(`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`);
  const [showExport, setShowExport] = useState(false);
  const [showBackup, setShowBackup] = useState(false);
  const [importPreview, setImportPreview] = useState(null); // 불러온 JSON 파싱 결과(파일 선택 직후 미리보기)
  const fileInputRef = useRef(null);
  const catColor = useCatColor(categories);
  const catIsFixed = useMemo(() => {
    const m = {};
    categories.forEach((c) => { m[c.label] = c.isFixed; });
    return m;
  }, [categories]);

  const monthLabel = `${ym.slice(0, 4)}년 ${parseInt(ym.slice(5), 10)}월`;
  const shiftMonth = (d) => {
    const [y, m] = ym.split('-').map(Number);
    const nd = new Date(y, m - 1 + d, 1);
    setYm(`${nd.getFullYear()}-${String(nd.getMonth() + 1).padStart(2, '0')}`);
  };

  // 카테고리별 지출 합계 (이번 달)
  const catTotals = useMemo(() => {
    const map = {};
    transactions.forEach((t) => {
      if (t.status !== 'done' || !t.category || parseDT(t.datetime).ym !== ym) return;
      map[t.category] = (map[t.category] || 0) + signedAmount(t);
    });
    return Object.entries(map)
      .map(([label, value]) => ({ label, value, color: catColor[label] || '#888' }))
      .filter((s) => s.value > 0)
      .sort((a, b) => b.value - a.value);
  }, [transactions, ym, catColor]);

  const catTotalsVariable = useMemo(() => catTotals.filter((s) => !catIsFixed[s.label]), [catTotals, catIsFixed]);

  // 총지출: 가계부에 기록된 이번 달 지출 전액 (카테고리 미지정 건 포함, 취소는 차감)
  const totalSpend = useMemo(
    () => transactions
      .filter((t) => t.status === 'done' && parseDT(t.datetime).ym === ym)
      .reduce((s, t) => s + signedAmount(t), 0),
    [transactions, ym]
  );
  const variableTotal = catTotalsVariable.reduce((s, x) => s + x.value, 0);
  const fixedTotal = totalSpend - variableTotal;

  // 변동비 예산 잔액
  const totalBudgetLimit = useMemo(
    () => budgets.filter((b) => b.month === ym && !catIsFixed[b.category]).reduce((s, b) => s + b.limit, 0),
    [budgets, ym, catIsFixed]
  );
  const remainBudget = totalBudgetLimit - variableTotal;
  const budgetUsedPct = totalBudgetLimit > 0 ? Math.round((variableTotal / totalBudgetLimit) * 100) : 0;

  // 수익 / 저축
  const totalIncome = useMemo(
    () => incomes.filter((i) => i.month === ym).reduce((s, i) => s + (i.amount || 0), 0),
    [incomes, ym]
  );
  const savings = totalIncome - totalSpend;

  // 카드 결제 예정
  const cardBillRows = useMemo(
    () => cardBills.filter((b) => b.month === ym).sort((a, b) => b.expectedAmount - a.expectedAmount),
    [cardBills, ym]
  );
  const totalCardBills = cardBillRows.reduce((s, b) => s + b.expectedAmount, 0);

  // 쇼핑리스트 요약
  const buyCount = shoppingItems.filter((i) => i.status === 'TO_BUY').length;
  const urgentItems = shoppingItems.filter((i) => {
    if (i.status !== 'IN_STOCK') return false;
    const d = dDayInfo(i.expiryDate);
    return d && d.level !== 'safe';
  });

  const summary = { totalSpend, fixedTotal, variableTotal, totalIncome, savings, remainBudget, totalBudgetLimit, budgetUsedPct, totalCardBills };

  // 전체 데이터 엑셀 다운로드 (전 탭 통합, 여러 시트)
  const exportAllXlsx = () => {
    const txnRows = transactions.map((t) => {
      const dt = parseDT(t.datetime);
      return {
        '날짜': dt.dayKey, '시간': dt.hhmm, '상호명': t.merchant, '카테고리': t.category || '미분류',
        '금액': signedAmount(t), '구분': t.type, '상태': t.status === 'pending' ? '미분류' : '완료',
        '결제수단': t.cardLast4 ? `카드 ${t.cardLast4}` : '현금', '메모': t.memo || '',
      };
    });
    const budgetRows = budgets.map((b) => ({ '월': b.month, '카테고리': b.category, '예산': b.limit }));
    const incomeRows = incomes.map((i) => ({ '월': i.month, '항목': i.category, '금액': i.amount, '메모': i.memo || '' }));
    const loanRows = (debts || []).map((d) => ({
      '대출상품': d.name, '대출일': d.startDate, '대출만기일': d.endDate, '대출잔액': d.remainingBalance,
      '금리(%)': d.rate, '납입방법': d.paymentMethod, '납입일': d.paymentDay, '납입계좌': d.paymentAccount, '메모': d.memo || '',
    }));
    const billRows = cardBills.map((b) => ({ '월': b.month, '카드사': b.cardName, '결제일': b.dueDate, '결제예정금액': b.expectedAmount }));
    const shopRowOf = (i) => ({
      '이름': i.name, '분류': (SHOPPING_CATS.find((c) => c.key === i.category) || {}).label || i.category,
      '상태': i.status === 'IN_STOCK' ? '보유 중' : '사야 할 것', '수량': i.quantity,
      '구매일': i.purchaseDate || '', '유통기한': i.expiryDate || '', '메모': i.memo || '',
    });
    downloadXlsx(`가계부_전체데이터_${new Date().toISOString().slice(0, 10)}.xlsx`, [
      { name: '가계부', rows: txnRows },
      { name: '예산', rows: budgetRows },
      { name: '수익', rows: incomeRows },
      { name: '대출내역', rows: loanRows },
      { name: '카드결제예정', rows: billRows },
      { name: '쇼핑리스트', rows: shoppingItems.map(shopRowOf) },
    ]);
  };

  const openFilePicker = () => fileInputRef.current?.click();
  const handleFileSelected = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // 같은 파일 다시 선택해도 change 이벤트 발생하도록 초기화
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        setImportPreview(parsed);
      } catch (err) {
        alert('JSON 파일을 읽을 수 없어요. 이 앱에서 내보낸 백업 파일이 맞는지 확인해주세요.');
      }
    };
    reader.readAsText(file);
  };

  return (
    <div>
      {/* 0. 전체 데이터 관리 버튼 (엑셀/JSON/불러오기/백업·복구) */}
      <div className="section">
        <div className="data-toolbar">
          <button className="data-btn" onClick={exportAllXlsx}>📊 엑셀</button>
          <button className="data-btn primary" onClick={onExportAllJson}>🗂️ JSON</button>
          <button className="data-btn" onClick={openFilePicker}>📥 불러오기</button>
          <button className="data-btn" onClick={() => setShowBackup(true)}>⏰ 백업/복구</button>
          <input ref={fileInputRef} type="file" accept="application/json" style={{ display: 'none' }} onChange={handleFileSelected} />
        </div>
      </div>

      {/* 1. 월 선택 + 노션 내보내기 */}
      <div className="section">
        <div className="section-head">
          <div className="month-nav">
            <button onClick={() => shiftMonth(-1)}>‹</button>
            <span className="month-label">{monthLabel}</span>
            <button onClick={() => shiftMonth(1)}>›</button>
          </div>
          <button className="notion-export-btn" onClick={() => setShowExport(true)}>📝 Notion 내보내기</button>
        </div>
      </div>

      {/* 2. 핵심 지표 요약 */}
      <div className="section">
        <div className="dash-stats-grid">
          <div className="dash-stat-card wide">
            <div className="dash-stat-label">이번 달 총지출</div>
            <div className="dash-stat-value">{won(totalSpend)}</div>
            <div className="dash-stat-sub">고정비 {fmt(fixedTotal)} · 변동비 {fmt(variableTotal)}</div>
          </div>
          <div className="dash-stat-card">
            <div className="dash-stat-label">이번 달 잔여 금액</div>
            <div className={'dash-stat-value ' + (savings >= 0 ? 'good' : 'bad')}>{won(savings)}</div>
            <div className="dash-stat-sub">수입 {fmt(totalIncome)} − 지출 {fmt(totalSpend)}</div>
          </div>
          <div className="dash-stat-card">
            <div className="dash-stat-label">남은 변동비 예산</div>
            <div className={'dash-stat-value ' + (remainBudget >= 0 ? 'good' : 'bad')}>{won(remainBudget)}</div>
            <div className="dash-stat-sub">{budgetUsedPct}% 사용</div>
          </div>
        </div>
      </div>

      {/* 3. 지출 분석 */}
      <div className="section">
        <div className="section-title" style={{ marginBottom: 12 }}>이번 달 변동비 카테고리별 비중</div>
        <div className="summary-card">
          {catTotalsVariable.length > 0 ? (
            <CategoryBreakdown segments={catTotalsVariable} total={variableTotal} centerLabel="변동비" />
          ) : (
            <div className="empty-state" style={{ padding: '20px 0' }}>
              <div className="es-text">이 달 변동비 지출이 없어요</div>
            </div>
          )}
        </div>
      </div>

      <div className="section">
        <div className="section-title" style={{ marginBottom: 12 }}>월별 지출 추이 (최근 4개월)</div>
        <div className="summary-card">
          <MonthlyTrendChart transactions={transactions} ym={ym} />
        </div>
      </div>

      {/* 4. 하단 퀵 브리핑 */}
      <div className="section">
        <div className="dash-quick-grid">
          <div className="dash-quick-card">
            <div className="dash-quick-title">💳 카드 결제 예정</div>
            <div className="dash-quick-amt">{won(totalCardBills)}</div>
            <div className="dash-quick-sub">{cardBillRows.length}건</div>
          </div>
          <button className="dash-quick-card clickable" onClick={() => onNavigateTab('shopping')}>
            <div className="dash-quick-title">🛒 쇼핑리스트</div>
            <div className="dash-quick-amt">{urgentItems.length > 0 ? `임박 ${urgentItems.length}건` : `살 것 ${buyCount}건`}</div>
            <div className="dash-quick-sub">{urgentItems.length > 0 ? `유통기한 확인 필요 · 살 것 ${buyCount}건` : '바로가기 ›'}</div>
          </button>
        </div>
      </div>

      {/* 월말 결산 배너 */}
      <div className="section">
        <button className="settle-banner" onClick={() => setShowExport(true)}>
          <div className="settle-banner-text">
            <div className="settle-banner-title">{parseInt(ym.slice(5), 10)}월 가계부 정리가 끝났나요?</div>
            <div className="settle-banner-sub">한 달 요약을 노션으로 깔끔하게 정리해보세요</div>
          </div>
          <span className="settle-banner-cta">Notion 보고서 생성하기 ›</span>
        </button>
      </div>

      {showExport && (
        <NotionExportSheet
          ym={ym}
          summary={summary}
          catTotalsVariable={catTotalsVariable}
          cardBillRows={cardBillRows}
          onClose={() => setShowExport(false)} />
      )}

      {showBackup && (
        <BackupGuideSheet onManualBackup={onExportAllJson} onClose={() => setShowBackup(false)} />
      )}

      {importPreview && (
        <ImportPreviewSheet
          parsed={importPreview}
          onConfirm={() => { onImportAllJson(importPreview); setImportPreview(null); }}
          onClose={() => setImportPreview(null)} />
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('ledger');
  const [transactions, setTransactions] = useState(window.MOCK.transactions);
  const [categories, setCategories] = useState(window.MOCK.categories);
  const [budgets, setBudgets] = useState(window.MOCK.budgets);
  const [incomes, setIncomes] = useState(window.MOCK.incomes);
  const [debts, setDebts] = useState(window.MOCK.debts);
  const [cards, setCards] = useState(window.MOCK.cards);
  const [cardBills, setCardBills] = useState(window.MOCK.cardBills);

  const pending = useMemo(() => transactions.filter((t) => t.status === 'pending'), [transactions]);
  useEffect(() => {
    if (pending.length > 0) setShowTagging(true);
    // eslint-disable-next-line
  }, []);

  const assign = (id, label, memo) => {
    setTransactions((ts) => {
      const updated = ts.map((t) => (t.id === id
        ? { ...t, category: label, status: 'done', ...(memo !== undefined ? { memo } : {}) }
        : t));
      const txn = updated.find((t) => t.id === id);
      if (txn && window.saveToFirestore) {
        window.saveToFirestore.updateTransaction(txn).catch((err) => console.error('저장 실패:', err));
      }
      return updated;
    });
  };

  const editCat = (id, label) => {

      const txn = updated.find((t) => t.id === id);

  const addCategory = (name, isFixed = false) => {
    const color = window.MOCK.colorPalette[categories.length % window.MOCK.colorPalette.length];
    const newCat = { key: 'custom_' + Date.now(), label: name, color, isFixed };
    setCategories((cs) => [...cs, newCat]);
    if (window.saveToFirestore) {
      window.saveToFirestore.updateCategory(newCat).catch((err) => console.error('저장 실패:', err));
    }
  };

  // 예산 설정/수정 (해당 월+카테고리 upsert)
  const setBudgetLimit = (month, category, limit) => {
    setBudgets((bs) => {
      const idx = bs.findIndex((b) => b.month === month && b.category === category);
      let budget;
      if (idx >= 0) { 
        const n = [...bs]; 
        n[idx] = { ...n[idx], limit }; 
        budget = n[idx];
        return n; 
      }
      budget = { month, category, limit };
      return [...bs, budget];
    });
    if (window.saveToFirestore) {
      window.saveToFirestore.updateBudget({ month, category, limit }).catch((err) => console.error('저장 실패:', err));
    }
  };

  // 수익 설정/수정 (해당 월+카테고리 upsert)
  const setIncomeValue = (month, category, amount, memo) => {
    setIncomes((is) => {
      const idx = is.findIndex((i) => i.month === month && i.category === category);
      let income;
      if (idx >= 0) { 
        const n = [...is]; 
        n[idx] = { ...n[idx], amount, memo }; 
        income = n[idx];
        return n; 
      }
      income = { month, category, amount, memo };
      return [...is, income];
    });
    if (window.saveToFirestore) {
      window.saveToFirestore.updateIncome({ month, category, amount, memo }).catch((err) => console.error('저장 실패:', err));
    }
  };

  // ── 부채탭: 대출 메모 ──
  const editLoanMemo = (id, memo) => {
    setDebts((ds) => {
      const updated = ds.map((d) => (d.id === id ? { ...d, memo } : d));
      const debt = updated.find((d) => d.id === id);
      if (debt && window.saveToFirestore) {
        window.saveToFirestore.updateDebt(debt).catch((err) => console.error('저장 실패:', err));
      }
      return updated;
    });
  };

  // ── 부채탭: 보유카드 ──
  const addCard = (name) => {
    const newCard = { key: 'card_' + Date.now(), name, isMain: cards.length === 0 };
    setCards((cs) => [...cs, newCard]);
    if (window.saveToFirestore) {
      window.saveToFirestore.updateCard(newCard).catch((err) => console.error('저장 실패:', err));
    }
  };
  const renameCard = (key, name) => {
    setCards((cs) => {
      const updated = cs.map((c) => (c.key === key ? { ...c, name } : c));
      const card = updated.find((c) => c.key === key);
      if (card && window.saveToFirestore) {
        window.saveToFirestore.updateCard(card).catch((err) => console.error('저장 실패:', err));
      }
      return updated;
    });
  };
  const deleteCard = (key) => {
    setCards((cs) => cs.filter((c) => c.key !== key));
    if (window.saveToFirestore) {
      window.saveToFirestore.deleteDocument('cards', key).catch((err) => console.error('삭제 실패:', err));
    }
  };
  const setMainCard = (key) => {
    setCards((cs) => {
      const updated = cs.map((c) => {
        const card = { ...c, isMain: c.key === key };
        if (c.key === key && window.saveToFirestore) {
          window.saveToFirestore.updateCard(card).catch((err) => console.error('저장 실패:', err));
        }
        return card;
      });
      return updated;
    });
  };

  // ── 부채탭: 카드사별 결제예정금액 ──
  const addCardBill = (cardName, month, dueDate, expectedAmount) => {
    const newBill = { id: 'cb_' + Date.now(), cardName, month, dueDate, expectedAmount, isPaid: false };
    setCardBills((bs) => [...bs, newBill]);
    if (window.saveToFirestore) {
      window.saveToFirestore.updateCardBill(newBill).catch((err) => console.error('저장 실패:', err));
    }
  };
  const editCardBill = (id, patch) => {
    setCardBills((bs) => {
      const updated = bs.map((b) => (b.id === id ? { ...b, ...patch } : b));
      const bill = updated.find((b) => b.id === id);
      if (bill && window.saveToFirestore) {
        window.saveToFirestore.updateCardBill(bill).catch((err) => console.error('저장 실패:', err));
      }
      return updated;
    });
  };
  const deleteCardBill = (id) => {
    setCardBills((bs) => bs.filter((b) => b.id !== id));
    if (window.saveToFirestore) {
      window.saveToFirestore.deleteDocument('cardBills', id).catch((err) => console.error('삭제 실패:', err));
    }
  };

  // ── 쇼핑리스트탭 ──
  const addShoppingItem = (item) => {
    setShoppingItems((is) => [item, ...is]);
    if (window.saveToFirestore) {
      window.saveToFirestore.updateShoppingItem(item).catch((err) => console.error('저장 실패:', err));
    }
  };
  const updateShoppingItem = (id, patch) => {
    setShoppingItems((is) => {
      const updated = is.map((i) => (i.id === id ? { ...i, ...patch } : i));
      const item = updated.find((i) => i.id === id);
      if (item && window.saveToFirestore) {
        window.saveToFirestore.updateShoppingItem(item).catch((err) => console.error('저장 실패:', err));
      }
      return updated;
    });
  };
  const deleteShoppingItem = (id) => {
    setShoppingItems((is) => is.filter((i) => i.id !== id));
    if (window.saveToFirestore) {
      window.saveToFirestore.deleteDocument('shoppingItems', id).catch((err) => console.error('삭제 실패:', err));
    }
  };
  const adjustShoppingQty = (id, delta) =>
    setShoppingItems((is) => is.map((i) => (i.id === id ? { ...i, quantity: Math.max(0, i.quantity + delta) } : i)));
  const moveShoppingToBuy = (id) =>
    setShoppingItems((is) => is.map((i) => (i.id === id ? { ...i, status: 'TO_BUY' } : i)));
  const markShoppingPurchased = (id) => {
    const today = new Date().toISOString().slice(0, 10);
    setShoppingItems((is) => is.map((i) => (i.id === id ? { ...i, status: 'IN_STOCK', purchaseDate: today } : i)));
  };
  const bulkMoveShoppingToStock = (ids) => {
    const today = new Date().toISOString().slice(0, 10);
    setShoppingItems((is) => is.map((i) => (ids.includes(i.id) ? { ...i, status: 'IN_STOCK', purchaseDate: today } : i)));
  };

  // ── 전체 데이터 백업(JSON)/복원 — Firestore 연동 전에도 지금 바로 쓸 수 있는 수동 백업 ──
  const exportAllJson = () => {
    const payload = {
      exportedAt: new Date().toISOString(),
      version: 1,
      data: { transactions, categories, budgets, incomes, debts, cards, cardBills, shoppingItems },
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `가계부_백업_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const importAllJson = (parsed) => {
    const d = parsed.data || parsed;
    if (d.transactions) setTransactions(d.transactions);
    if (d.categories) setCategories(d.categories);
    if (d.budgets) setBudgets(d.budgets);
    if (d.incomes) setIncomes(d.incomes);
    if (d.debts) setDebts(d.debts);
    if (d.cards) setCards(d.cards);
    if (d.cardBills) setCardBills(d.cardBills);
    if (d.shoppingItems) setShoppingItems(d.shoppingItems);
  };

  // 카테고리 이름 변경 → 거래의 category 문자열도 함께 갱신
  const renameCategory = (key, newLabel) => {
    const old = categories.find((c) => c.key === key);
    if (!old || !newLabel.trim()) return;
    const label = newLabel.trim();
    setCategories((cs) => cs.map((c) => (c.key === key ? { ...c, label } : c)));
    setTransactions((ts) => ts.map((t) => (t.category === old.label ? { ...t, category: label } : t)));
    if (window.saveToFirestore) {
      window.saveToFirestore.updateCategory({ ...old, label }).catch((err) => console.error('저장 실패:', err));
    }
  };

  const recolorCategory = (key, color) => {
    setCategories((cs) => cs.map((c) => (c.key === key ? { ...c, color } : c)));
    if (window.saveToFirestore) {
      const cat = categories.find((c) => c.key === key);
      if (cat) {
        window.saveToFirestore.updateCategory({ ...cat, color }).catch((err) => console.error('저장 실패:', err));
      }
    }
  };

  // 카테고리 삭제 → 해당 거래는 미분류 처리하지 않고 category만 비움(분류하기 상태)
  const toggleFixedCategory = (key) => {
    setCategories((cs) => cs.map((c) => (c.key === key ? { ...c, isFixed: !c.isFixed } : c)));
    if (window.saveToFirestore) {
      const cat = categories.find((c) => c.key === key);
      if (cat) {
        window.saveToFirestore.updateCategory({ ...cat, isFixed: !cat.isFixed }).catch((err) => console.error('저장 실패:', err));
      }
    }
  };

  const deleteCategory = (key) => {
    const target = categories.find((c) => c.key === key);
    if (!target) return;
    setCategories((cs) => cs.filter((c) => c.key !== key));
    setTransactions((ts) => ts.map((t) => (t.category === target.label ? { ...t, category: null } : t)));
    if (window.saveToFirestore) {
      window.saveToFirestore.deleteDocument('categories', key).catch((err) => console.error('삭제 실패:', err));
    }
  };

  const pendingCount = pending.length;

  return (
    <div className="app-shell">
      <div className="app-header">
        <div className="brand">
          <div className="brand-mark">₩</div>
          <div>
            <div className="brand-title">올인원 가계부</div>
            <div className="brand-sub">개인 지출·예산·부채 통합 관리</div>
          </div>
        </div>
      </div>

      <div className="tab-bar">
        {TABS.map((t) => (
          <button key={t.key} className={'tab-item ' + (tab === t.key ? 'active' : '')} onClick={() => setTab(t.key)}>
            <span>{t.icon}</span>{t.label}
            {t.key === 'ledger' && pendingCount > 0 && <span className="tab-badge">{pendingCount}</span>}
          </button>
        ))}
      </div>

      <div className="app-body">
        {tab === 'ledger' && (
          <LedgerTab
            transactions={transactions}
            categories={categories}
            colorPalette={window.MOCK.colorPalette}
            onAssign={assign}
            onEditCat={editCat}
            onEditMemo={editMemo}
            onEditAmount={editAmount}
            onEditMerchant={editMerchant}
            onEditDate={editDate}
            onAddManual={addManual}
            onDeleteTxn={deleteTransaction}
            onAddCategory={addCategory}
            onRenameCategory={renameCategory}
            onRecolorCategory={recolorCategory}
            onDeleteCategory={deleteCategory}
            onToggleFixedCategory={toggleFixedCategory}
          />
        )}
        {tab === 'budget'   && (
          <BudgetTab
            transactions={transactions}
            categories={categories}
            budgets={budgets}
            incomes={incomes}
            colorPalette={window.MOCK.colorPalette}
            onSetBudget={setBudgetLimit}
            onSetIncome={setIncomeValue}
            onEditCat={editCat}
            onEditMemo={editMemo}
            onEditAmount={editAmount}
            onEditMerchant={editMerchant}
            onEditDate={editDate}
            onAddManual={addManual}
            onDeleteTxn={deleteTransaction}
            onRenameCategory={renameCategory}
            onRecolorCategory={recolorCategory}
            onDeleteCategory={deleteCategory}
            onToggleFixedCategory={toggleFixedCategory}
            onAddCategory={addCategory}
          />
        )}
        {tab === 'debt'     && (
          <DebtTab
            debts={debts}
            cards={cards}
            cardBills={cardBills}
            onEditLoanMemo={editLoanMemo}
            onAddCard={addCard}
            onRenameCard={renameCard}
            onDeleteCard={deleteCard}
            onSetMainCard={setMainCard}
            onAddCardBill={addCardBill}
            onEditCardBill={editCardBill}
            onDeleteCardBill={deleteCardBill}
          />
        )}
        {tab === 'shopping' && (
          <ShoppingTab
            items={shoppingItems}
            onAdd={addShoppingItem}
            onUpdate={updateShoppingItem}
            onDelete={deleteShoppingItem}
            onAdjustQty={adjustShoppingQty}
            onMoveToBuy={moveShoppingToBuy}
            onMarkPurchased={markShoppingPurchased}
            onBulkMoveToStock={bulkMoveShoppingToStock}
          />
        )}
        {tab === 'home'     && (
          <DashboardTab
            transactions={transactions}
            categories={categories}
            budgets={budgets}
            incomes={incomes}
            debts={debts}
            cardBills={cardBills}
            shoppingItems={shoppingItems}
            onNavigateTab={setTab}
            onExportAllJson={exportAllJson}
            onImportAllJson={importAllJson}
          />
        )}
      </div>

      {showTagging && pending.length > 0 && (
        <TaggingModal
          pending={pending}
          categories={categories}
          colorPalette={window.MOCK.colorPalette}
          onAssign={assign}
          onAddCategory={addCategory}
          onClose={() => setShowTagging(false)}
        />
      )}
    </div>
  );
}

(async function boot() {
  if (window.loadFirestoreData) await window.loadFirestoreData();
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script>
</body>
</html>
