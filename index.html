/* ========== Firestore 연동 커넥터 (저장 기능 포함) ========== */
(function () {
  const firebaseConfig = {
    apiKey: "AIzaSyCaa3qLpCcyY-zX718Posr14Dzhu1-6KnA",
    authDomain: "budget-13ce4.firebaseapp.com",

    appId: "1:884695004806:web:9445daecd413c272c34307",
    measurementId: "G-79GWDQKWVS",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const COLLECTIONS = ['categories', 'transactions', 'budgets', 'incomes', 'debts', 'cards', 'cardBills', 'shoppingItems'];
  const ID_KEY = { categories: 'key', transactions: 'id', debts: 'id', cards: 'key', cardBills: 'id', shoppingItems: 'id' };

  async function fetchCollection(name) {
    const snap = await db.collection(name).get();
    return snap.docs.map((d) => d.data());
  }

  async function seedFromMock() {
    const MOCK = window.MOCK;
    for (const name of COLLECTIONS) {
      const rows = MOCK[name] || [];
      const idKey = ID_KEY[name];
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const docId = idKey ? row[idKey] : ((name === 'budgets' || name === 'incomes') ? `${row.month}_${row.category}` : `${name}_${i}`);
        await db.collection(name).doc(String(docId)).set(row);
      }
    }
  }

  // 예산·수익은 (월+카테고리)가 키. 예전 방식으로 저장된 중복 문서를 정리한다.
  async function cleanupDuplicates(name) {
    const snap = await db.collection(name).get();
    const seen = {};
    const deletions = [];
    snap.docs.forEach((d) => {
      const row = d.data();
      if (!row || !row.month || !row.category) return;
      const properId = `${row.month}_${row.category}`;
      if (d.id !== properId) {
        // 올바른 ID로 옮기고 잘못된 문서는 제거
        deletions.push(d.ref.delete());
        if (!seen[properId]) {
          seen[properId] = true;
          deletions.push(db.collection(name).doc(properId).set(row, { merge: true }));
        }
      }
    });
    if (deletions.length) await Promise.all(deletions);
  }

  window.loadFirestoreData = async function () {
    try {
      const catSnap = await db.collection('categories').limit(1).get();
      if (catSnap.empty) {
        await seedFromMock();
      }
      await cleanupDuplicates('incomes');
      await cleanupDuplicates('budgets');
      const results = {};
      for (const name of COLLECTIONS) {
        results[name] = await fetchCollection(name);
      }
      window.MOCK = { colorPalette: window.MOCK.colorPalette, ...results };
    } catch (err) {
      console.error('Firestore 로드 실패:', err);
    }
  };

  /* ✅ 저장 함수 추가 */
  window.saveToFirestore = {
    async updateTransaction(transaction) {
      try {
        await db.collection('transactions').doc(String(transaction.id)).set(transaction);
        console.log('✅ 거래 저장:', transaction.id);
      } catch (err) {
        console.error('❌ 저장 실패:', err);
      }
    },
    async updateCategory(category) {
      try {
        await db.collection('categories').doc(String(category.key)).set(category);
        console.log('✅ 카테고리 저장:', category.key);
      } catch (err) {
        console.error('❌ 저장 실패:', err);
      }
    },
    async updateBudget(budget) {
      try {
        const docId = `${budget.month}_${budget.category}`;
        await db.collection('budgets').doc(docId).set(budget);
        console.log('✅ 예산 저장:', docId);
      } catch (err) {
        console.error('❌ 저장 실패:', err);
      }
    },
    async updateIncome(income) {
      try {
        const docId = `${income.month}_${income.category}`;
        await db.collection('incomes').doc(docId).set(income);
        console.log('✅ 수익 저장:', docId);
      } catch (err) {
        console.error('❌ 저장 실패:', err);
      }
    },
    async updateDebt(debt) {
      try {
        await db.collection('debts').doc(String(debt.id)).set(debt);
        console.log('✅ 대출 저장:', debt.id);
      } catch (err) {
        console.error('❌ 저장 실패:', err);
      }
    },
    async updateCard(card) {
      try {
        await db.collection('cards').doc(String(card.key)).set(card);
        console.log('✅ 카드 저장:', card.key);
      } catch (err) {
        console.error('❌ 저장 실패:', err);
      }
    },
    async updateCardBill(bill) {
      try {
        await db.collection('cardBills').doc(String(bill.id)).set(bill);
        console.log('✅ 결제예정 저장:', bill.id);
      } catch (err) {
        console.error('❌ 저장 실패:', err);
      }

    async updateShoppingItem(item) {

      } catch (err) {

  };

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ================= 유틸 ================= */
const fmt = (n) => n.toLocaleString('ko-KR');
const won = (n) => fmt(n) + '원';
// 캘린더 셀용 압축 금액: 1만 이상은 'N.N만'
const shortWon = (n) => (n >= 10000 ? (Math.round(n / 1000) / 10) + '만' : fmt(n));

// 엑셀(.xlsx) 다운로드 — sheets: [{ name, rows(객체 배열, 키가 헤더가 됨) }]
function downloadXlsx(filename, sheets) {
  const wb = XLSX.utils.book_new();
  sheets.forEach(({ name, rows }) => {
    const ws = XLSX.utils.json_to_sheet(rows && rows.length ? rows : [{ '내용': '데이터 없음' }]);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31)); // 엑셀 시트명 31자 제한
  });
  XLSX.writeFile(wb, filename);
}

// 카테고리 → 색 매핑 (동적 카테고리 포함)
function useCatColor(categories) {
  return useMemo(() => {
    const m = {};
    categories.forEach((c) => { m[c.label] = c.color; });
    return m;
  }, [categories]);
}

// 부호 있는 금액 (취소는 음수)
const signedAmount = (t) => (t.type === '취소' ? -t.amount : t.amount);

// datetime → { ym:'2026-08', dayKey:'2026-08-20', mmdd:'08/20', hhmm:'23:33', label:'8월 20일 (수)' }
function parseDT(iso) {
  const d = new Date(iso);
  const pad = (x) => String(x).padStart(2, '0');
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  return {
    ym: `${d.getFullYear()}-${pad(d.getMonth() + 1)}`,
    dayKey: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
    mmdd: `${pad(d.getMonth() + 1)}/${pad(d.getDate())}`,
    hhmm: `${pad(d.getHours())}:${pad(d.getMinutes())}`,
    dayLabel: `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`,
    ts: d.getTime(),
  };
}

const initial = (s) => (s ? s.trim().charAt(0) : '?');

/* ================= 도넛 차트 (SVG, 외부 라이브러리 없음) ================= */
function Donut({ segments, size = 116, stroke = 20 }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const total = segments.reduce((s, x) => s + x.value, 0);
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <g transform={`rotate(-90 ${size / 2} ${size / 2})`}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#E9EDF3" strokeWidth={stroke} />
        {total > 0 && segments.map((seg, i) => {
          const len = (seg.value / total) * c;
          const dash = `${len} ${c - len}`;
          const el = (
            <circle key={i} cx={size / 2} cy={size / 2} r={r} fill="none"
              stroke={seg.color} strokeWidth={stroke}
              strokeDasharray={dash} strokeDashoffset={-offset} />
          );
          offset += len;
          return el;
        })}
      </g>
    </svg>
  );
}

/* ================= 카테고리 도넛+2단 범례 (재사용) ================= */
function CategoryBreakdown({ segments, total, centerLabel }) {
  if (segments.length === 0) return null;
  return (
    <React.Fragment>
      <div className="donut-solo">
        <div className="donut">
          <Donut segments={segments} />
          <div className="donut-center">
            <div className="dc-count">{segments.length}</div>
            <div className="dc-label">{centerLabel}</div>
          </div>
        </div>
      </div>
      <div className="legend2-grid">
        {segments.map((s) => (
          <div key={s.label} className="legend2-item">
            <div className="legend2-top">
              <span className="legend-dot" style={{ background: s.color }} />
              <span className="legend2-name">{s.label}</span>
            </div>
            <div className="legend2-bottom">
              <span className="legend2-pct">{total > 0 ? Math.round((s.value / total) * 100) : 0}%</span>
              <span className="legend2-val">{won(s.value)}</span>
            </div>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

/* ================= 미분류 태깅 모달 (첨부 HTML 이식) ================= */
/* ================= 가로 드래그 스크롤 컨테이너 (마우스 드래그 + 터치/휠 모두 지원) ================= */
function HDragScroll({ className, children }) {
  const ref = useRef(null);
  const drag = useRef({ down: false, startX: 0, scrollLeft: 0, moved: false });

  const onDown = (e) => {
    drag.current = { down: true, startX: e.pageX, scrollLeft: ref.current.scrollLeft, moved: false };
  };
  const endDrag = () => { drag.current.down = false; };
  const onMove = (e) => {
    if (!drag.current.down) return;
    const dx = e.pageX - drag.current.startX;
    if (Math.abs(dx) > 3) drag.current.moved = true;
    ref.current.scrollLeft = drag.current.scrollLeft - dx;
  };
  // 드래그로 살짝 움직였으면 그 직후 click 이벤트를 막아 버튼 오클릭 방지
  const onClickCapture = (e) => { if (drag.current.moved) { e.stopPropagation(); e.preventDefault(); } };

  return (
    <div ref={ref} className={className}
      onMouseDown={onDown} onMouseMove={onMove} onMouseUp={endDrag} onMouseLeave={endDrag}
      onClickCapture={onClickCapture}>
      {children}
    </div>
  );
}

function TaggingModal({ pending, categories, colorPalette, onAssign, onAddCategory, onClose }) {
  const [idx, setIdx] = useState(0);
  const [results, setResults] = useState([]);
  const [done, setDone] = useState(false);
  const [addOpen, setAddOpen] = useState(false);
  const [newCat, setNewCat] = useState('');
  const [memo, setMemo] = useState('');
  const inputRef = useRef(null);

  useEffect(() => { if (addOpen && inputRef.current) inputRef.current.focus(); }, [addOpen]);
  useEffect(() => { setMemo(''); }, [idx]); // 카드 넘어갈 때 메모 초기화

  const t = pending[idx];

  const select = (label) => {
    const trimmed = memo.trim();
    onAssign(t.id, label, trimmed);
    const next = [...results, { ...t, category: label, memo: trimmed }];
    setResults(next);
    if (idx + 1 < pending.length) setIdx(idx + 1);
    else setDone(true);
  };

  const confirmAdd = () => {
    const name = newCat.trim();
    if (!name) { inputRef.current && inputRef.current.focus(); return; }
    onAddCategory(name);
    setNewCat('');
    setAddOpen(false);
  };

  const catColor = useCatColor(categories);
  const dt = t ? parseDT(t.datetime) : null;

  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-top">
          <div className="modal-eyebrow">미분류 거래 {pending.length}건</div>
          <div className="progress-dots">
            {pending.map((_, i) => (
              <span key={i} className={'dot ' + (i < idx ? 'done' : i === idx && !done ? 'active' : '')} />
            ))}
          </div>
        </div>

        {!done ? (
          <div>
            <div className="card-stack">
              <div className="txn-card">
                <div className="merchant-row">
                  <div className="merchant-badge">{initial(t.merchant)}</div>
                  <div className="merchant-name">{t.merchant}</div>
                </div>
                <div className="txn-meta">{dt.mmdd} {dt.hhmm} · {t.cardLast4 ? `카드 ${t.cardLast4}` : '현금'}</div>
                <div className="txn-amount-big">{won(t.amount)}</div>
                <div className="txn-cumulative">{idx + 1} / {pending.length} 분류 중</div>
              </div>
            </div>

            <input className="memo-input" type="text" value={memo} maxLength={40}
              placeholder="📝 뭐 샀는지 메모 (선택)"
              onChange={(e) => setMemo(e.target.value)} />

            <div className="cat-label"><span>카테고리를 선택하세요</span><span className="cat-drag-hint">← 옆으로 드래그 →</span></div>

            <div className="cat-section-label">변동비</div>
            <HDragScroll className="cat-scroll-grid">
              {categories.filter((c) => !c.isFixed).map((cat) => (
                <button key={cat.key} className="cat-chip"
                  onMouseEnter={(e) => (e.currentTarget.style.borderColor = cat.color)}
                  onMouseLeave={(e) => (e.currentTarget.style.borderColor = 'var(--border)')}
                  onClick={() => select(cat.label)}>
                  <span className="cat-dot" style={{ background: cat.color }} />{cat.label}
                </button>
              ))}
            </HDragScroll>

            <div className="cat-section-label">고정비</div>
            <HDragScroll className="cat-scroll-grid">
              {categories.filter((c) => c.isFixed).map((cat) => (
                <button key={cat.key} className="cat-chip"
                  onMouseEnter={(e) => (e.currentTarget.style.borderColor = cat.color)}
                  onMouseLeave={(e) => (e.currentTarget.style.borderColor = 'var(--border)')}
                  onClick={() => select(cat.label)}>
                  <span className="cat-dot" style={{ background: cat.color }} />{cat.label}
                </button>
              ))}
            </HDragScroll>

            <button className="cat-btn add-btn" style={{ width: '100%', marginTop: 8 }} onClick={() => setAddOpen((v) => !v)}>
              <span className="plus">+</span> 카테고리 추가
            </button>

            {addOpen && (
              <div className="add-form">
                <input ref={inputRef} type="text" value={newCat} maxLength={10}
                  placeholder="새 카테고리 이름 (예: 반려동물)"
                  onChange={(e) => setNewCat(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter') confirmAdd();
                    if (e.key === 'Escape') setAddOpen(false);
                  }} />
                <button onClick={confirmAdd}>추가</button>
                <button className="cancel-x" onClick={() => setAddOpen(false)}>✕</button>
              </div>
            )}

            <div style={{ textAlign: 'center', marginTop: 16 }}>
              <button className="skip-btn" onClick={onClose}>나중에 분류하기</button>
            </div>
          </div>
        ) : (
          <div className="done-state">
            <div className="done-check">✓</div>
            <div className="done-title">분류 완료</div>
            <div className="done-sub">{results.length}건이 정리됐어요</div>
            <div className="done-summary">
              {results.map((r, i) => {
                const rdt = parseDT(r.datetime);
                return (
                  <div key={i} className="done-row">
                    <span className="cat-tag">{rdt.mmdd} · {won(r.amount)}</span>
                    <span className="cat-val">
                      <span className="dv-dot" style={{ background: catColor[r.category] || '#888' }} />
                      {r.category}
                    </span>
                  </div>
                );
              })}
            </div>
            <button className="close-btn" onClick={onClose}>대시보드로 돌아가기</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ================= 인라인 카테고리 수정 팝오버 ================= */
function CatEditPopover({ categories, current, onPick, onClose, anchorRect }) {
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [onClose]);

  // 앵커 아래에 위치 (화면 밖으로 안 나가게 살짝 왼쪽 정렬)
  const style = {
    top: anchorRect.bottom + window.scrollY + 6,
    left: Math.min(anchorRect.left + window.scrollX, window.innerWidth - 170),
  };
  return (
    <div className="cat-edit-pop" ref={ref} style={style}>
      {categories.map((c) => (
        <button key={c.key} className={'cat-edit-opt ' + (c.label === current ? 'current' : '')}
          onClick={() => onPick(c.label)}>
          <span className="ceo-dot" style={{ background: c.color }} />{c.label}
          {c.label === current && <span style={{ marginLeft: 'auto' }}>✓</span>}
        </button>
      ))}
    </div>
  );
}

/* ================= 수동 입력 시트 ================= */
function ManualSheet({ categories, initialDate, onSave, onClose }) {
  const [merchant, setMerchant] = useState('');
  const [amount, setAmount] = useState('');
  const [category, setCategory] = useState(categories[0] ? categories[0].label : '');
  const [type, setType] = useState('승인');
  const [date, setDate] = useState(initialDate || new Date().toISOString().slice(0, 10));
  const [memo, setMemo] = useState('');

  const amountNum = parseInt((amount || '').replace(/[^0-9]/g, ''), 10) || 0;
  const canSave = merchant.trim() && amountNum > 0;

  const save = () => {
    if (!canSave) return;
    onSave({
      id: 'manual_' + Date.now(),
      merchant: merchant.trim(),
      amount: amountNum,
      category,
      datetime: date + 'T' + new Date().toTimeString().slice(0, 8),
      cardLast4: null,
      type,
      status: 'done',
      memo: memo.trim(),
    });
  };

  return (
    <div className="sheet-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet">
        <div className="sheet-handle" />
        <div className="sheet-title">수동 입력</div>

        <div className="field">
          <label className="field-label">금액</label>
          <input className="amount-input" inputMode="numeric" placeholder="0원"
            value={amount ? fmt(amountNum) : ''}
            onChange={(e) => setAmount(e.target.value)} />
        </div>

        <div className="field">
          <label className="field-label">사용처</label>
          <input placeholder="예: 동네 마트, 현금 결제" value={merchant}
            onChange={(e) => setMerchant(e.target.value)} />
        </div>

        <div className="field">
          <label className="field-label">유형</label>
          <div className="type-toggle">
            <button className={type === '승인' ? 'active' : ''} onClick={() => setType('승인')}>승인(지출)</button>
            <button className={type === '취소' ? 'active' : ''} onClick={() => setType('취소')}>취소(환불)</button>
          </div>
        </div>

        <div className="field">
          <label className="field-label">날짜</label>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        </div>

        <div className="field">
          <label className="field-label">카테고리</label>
          <div className="cat-select-grid">
            {categories.map((c) => (

/* ================= 카테고리 관리 시트 ================= */
function CategoryManagerSheet({ categories, colorPalette, onRename, onRecolor, onDelete, onAdd, onToggleFixed, onClose, budgetMode, limitByCat, onSetBudget, filterFixed }) {
  const [drafts, setDrafts] = useState({});
  const [budgetDrafts, setBudgetDrafts] = useState({});
  const [newName, setNewName] = useState('');
  // filterFixed가 지정 안 된 "전체" 모드에서만 고정비/변동비 탭 스위처를 보여줌 (리스트가 너무 길어지는 것 방지)
  const showTabs = filterFixed === undefined;
  const [activeTab, setActiveTab] = useState('variable'); // 'variable' | 'fixed'
  const effectiveFixed = showTabs ? activeTab === 'fixed' : filterFixed;
  const addAsFixed = showTabs ? activeTab === 'fixed' : filterFixed === true;

  const list = categories.filter((c) => c.isFixed === effectiveFixed);
  const sheetTitle = filterFixed === true ? '고정비 관리' : filterFixed === false ? '변동비 카테고리 관리' : '카테고리 관리';

  const nameOf = (c) => (drafts[c.key] !== undefined ? drafts[c.key] : c.label);
  const setDraft = (key, v) => setDrafts((d) => ({ ...d, [key]: v }));
  const commit = (c) => {
    const v = (drafts[c.key] !== undefined ? drafts[c.key] : c.label).trim();
    if (v && v !== c.label) onRename(c.key, v);
    setDrafts((d) => { const n = { ...d }; delete n[c.key]; return n; });
  };
  const cycleColor = (c) => {
    const i = colorPalette.indexOf(c.color);
    onRecolor(c.key, colorPalette[(i + 1) % colorPalette.length]);
  };
  const addNew = () => { const v = newName.trim(); if (!v) return; onAdd(v, addAsFixed); setNewName(''); };

  const budgetValOf = (c) => (budgetDrafts[c.key] !== undefined ? budgetDrafts[c.key] : String(limitByCat[c.label] || ''));
  const setBudgetDraft = (key, v) => setBudgetDrafts((d) => ({ ...d, [key]: v }));
  const commitBudget = (c) => {
    const raw = budgetDrafts[c.key];
    if (raw === undefined) return;
    const v = parseInt(raw.replace(/[^0-9]/g, ''), 10) || 0;
    onSetBudget(c.label, v);
    setBudgetDrafts((d) => { const n = { ...d }; delete n[c.key]; return n; });
  };

  return (
    <div className="sheet-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet">
        <div className="sheet-handle" />
        <div className="sheet-title">{sheetTitle}{budgetMode ? ' · 예산' : ''}</div>

        {showTabs && (
          <div className="catmgr-tabs">
            <button className={'catmgr-tab ' + (activeTab === 'variable' ? 'active' : '')} onClick={() => setActiveTab('variable')}>💳 변동비</button>
            <button className={'catmgr-tab ' + (activeTab === 'fixed' ? 'active' : '')} onClick={() => setActiveTab('fixed')}>📌 고정비</button>
          </div>
        )}

        <div className="catmgr-list">
          {list.map((c) => (
            <div key={c.key} className="catmgr-card">
              <div className="catmgr-row">
                <button className="catmgr-dot" style={{ background: c.color }}
                  title="색상 변경" onClick={() => cycleColor(c)} />
                <input className="catmgr-name" value={nameOf(c)} maxLength={10}
                  onChange={(e) => setDraft(c.key, e.target.value)}
                  onBlur={() => commit(c)}
                  onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
                <button className="catmgr-del" title="삭제" onClick={() => onDelete(c.key)}>✕</button>
              </div>
              <div className="catmgr-row2">
                <button className={'catmgr-fixed ' + (c.isFixed ? 'active' : '')}
                  title="고정비로 표시 (예산 사용률에서 제외)"
                  onClick={() => onToggleFixed(c.key)}>📌 고정비{c.isFixed ? ' 해제' : '로 표시'}</button>
                {budgetMode && !c.isFixed && (
                  <span className="catmgr-budget">
                    <span className="cb-label">예산</span>
                    <input inputMode="numeric" placeholder="0"
                      value={budgetValOf(c) ? fmt(parseInt(budgetValOf(c).replace(/[^0-9]/g, ''), 10) || 0) : ''}
                      onChange={(e) => setBudgetDraft(c.key, e.target.value)}
                      onBlur={() => commitBudget(c)}
                      onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
                    <span className="cb-won">원</span>
                  </span>
                )}
              </div>
            </div>
          ))}
          {list.length === 0 && (
            <div className="empty-state" style={{ padding: '20px 0' }}>
              <div className="es-text">표시할 카테고리가 없어요</div>
            </div>
          )}
        </div>

        <div className="catmgr-add">
          <input value={newName} maxLength={10} placeholder={addAsFixed ? '새 고정비 이름 (예: 정수기 렌탈)' : '새 카테고리 이름'}
            onChange={(e) => setNewName(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') addNew(); }} />
          <button onClick={addNew}>＋ 추가</button>
        </div>

        <div className="catmgr-note">• 색 동그라미로 색상 변경 · 이름은 바로 수정{budgetMode ? ' · 예산은 변동비 카테고리만 입력 가능' : ''} · 📌 고정비 표시 시 예산 계산에서 제외 · ✕는 삭제(해당 거래는 미분류로)</div>

        <div className="sheet-actions">
          <button className="btn-save" onClick={onClose}>완료</button>
        </div>
      </div>
    </div>
  );
}

/* ================= 가계부 탭 ================= */
function LedgerTab({ transactions, categories, colorPalette, onAssign, onEditCat, onEditMemo, onEditAmount, onEditMerchant, onEditDate, onAddManual, onDeleteTxn, onAddCategory, onRenameCategory, onRecolorCategory, onDeleteCategory, onToggleFixedCategory }) {
  const now = new Date();
  const [ym, setYm] = useState(`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`);
  const [filter, setFilter] = useState('전체');
  const [editing, setEditing] = useState(null); // { id, rect }
  const [detailId, setDetailId] = useState(null); // 거래 상세/메모 시트
  const [showManual, setShowManual] = useState(false);
  const [manualDate, setManualDate] = useState(null); // 캘린더 빈 날짜 클릭 시 그 날짜로 입력
  const [showCatMgr, setShowCatMgr] = useState(false); // 카테고리 관리 시트
  const [showCalendar, setShowCalendar] = useState(false); // 지출 캘린더 펼침
  const [calDay, setCalDay] = useState(null); // 캘린더 날짜 클릭 팝업 (dayKey)
  const [showTotalSummary, setShowTotalSummary] = useState(false); // 총지출 상세 펼침
  const catColor = useCatColor(categories);
  const catIsFixed = useMemo(() => {
    const m = {};
    categories.forEach((c) => { m[c.label] = c.isFixed; });
    return m;
  }, [categories]);

  const monthLabel = `${ym.slice(0, 4)}년 ${parseInt(ym.slice(5), 10)}월`;
  const shiftMonth = (d) => {
    const [y, m] = ym.split('-').map(Number);
    const nd = new Date(y, m - 1 + d, 1);
    setYm(`${nd.getFullYear()}-${String(nd.getMonth() + 1).padStart(2, '0')}`);
  };

  // 이번 달 거래 (분류 완료 = done만 요약/리스트에, pending도 리스트엔 표시)
  const monthTxns = useMemo(
    () => transactions
      .filter((t) => parseDT(t.datetime).ym === ym)
      .sort((a, b) => parseDT(b.datetime).ts - parseDT(a.datetime).ts),
    [transactions, ym]
  );

  // 카테고리별 합계 (취소 반영, pending 제외)
  const catTotals = useMemo(() => {
    const map = {};
    monthTxns.forEach((t) => {
      if (t.status !== 'done' || !t.category) return;
      map[t.category] = (map[t.category] || 0) + signedAmount(t);
    });
    return Object.entries(map)
      .map(([label, value]) => ({ label, value, color: catColor[label] || '#888' }))
      .filter((s) => s.value > 0)
      .sort((a, b) => b.value - a.value);
  }, [monthTxns, catColor]);

  // 총지출: 이번 달 기록된 지출 전액 (카테고리 미지정 건 포함, 취소는 차감)
  const monthTotal = useMemo(
    () => monthTxns
      .filter((t) => t.status === 'done')
      .reduce((s, t) => s + signedAmount(t), 0),
    [monthTxns]
  );

  // 고정비/변동비 분리 (도넛 및 요약 문구용)
  const catTotalsVariable = useMemo(
    () => catTotals.filter((s) => !catIsFixed[s.label]),
    [catTotals, catIsFixed]
  );
  const variableTotal = catTotalsVariable.reduce((s, x) => s + x.value, 0);
  const fixedTotal = monthTotal - variableTotal;
  const fixedPct = monthTotal > 0 ? Math.round((fixedTotal / monthTotal) * 100) : 0;
  const variablePct = monthTotal > 0 ? Math.round((variableTotal / monthTotal) * 100) : 0;

  // 필터 적용된 리스트 (전체 / 미분류 / 카테고리별)
  const filtered = useMemo(
    () => monthTxns.filter((t) =>
      filter === '전체' ? true
        : filter === '미분류' ? t.status === 'pending'
          : t.category === filter),
    [monthTxns, filter]
  );

  const pendingCount = monthTxns.filter((t) => t.status === 'pending').length;

  // 지출 캘린더: 주 단위 셀 배열 (일별 합계 포함)
  const calWeeks = useMemo(() => {
    const [y, m] = ym.split('-').map(Number);
    const startPad = new Date(y, m - 1, 1).getDay(); // 0=일
    const daysInMonth = new Date(y, m, 0).getDate();
    const totals = {};
    monthTxns.forEach((t) => {
      if (t.status !== 'done') return;
      const k = parseDT(t.datetime).dayKey;
      totals[k] = (totals[k] || 0) + signedAmount(t);
    });
    const cells = [];
    for (let i = 0; i < startPad; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      cells.push({ day: d, key, total: totals[key] || 0 });
    }
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
    return weeks;
  }, [ym, monthTxns]);

  // 날짜별 그룹
  const groups = useMemo(() => {
    const g = {};
    filtered.forEach((t) => {
      const k = parseDT(t.datetime).dayKey;
      (g[k] = g[k] || []).push(t);
    });
    return Object.keys(g).sort((a, b) => (a < b ? 1 : -1)).map((k) => ({
      key: k, label: parseDT(g[k][0].datetime).dayLabel, items: g[k],
      total: g[k].filter((t) => t.status === 'done').reduce((s, t) => s + signedAmount(t), 0),
    }));
  }, [filtered]);

  const exportLedgerXlsx = () => {
    const rows = monthTxns.map((t) => {
      const dt = parseDT(t.datetime);
      return {
        '날짜': dt.dayKey,
        '시간': dt.hhmm,
        '상호명': t.merchant,
        '카테고리': t.category || '미분류',
        '금액': signedAmount(t),
        '구분': t.type,
        '상태': t.status === 'pending' ? '미분류' : '완료',
        '결제수단': t.cardLast4 ? `카드 ${t.cardLast4}` : '현금',
        '메모': t.memo || '',
      };
    });
    downloadXlsx(`가계부_${ym}.xlsx`, [{ name: '거래내역', rows }]);
  };

  return (
    <div>
      {/* 월별 요약 */}
      <div className="section">
        <div className="section-head">
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div className="section-title">월별 지출 요약</div>
            <button className="cat-mgr-btn" onClick={() => setShowCatMgr(true)}>⚙ 카테고리</button>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div className="month-nav">
              <button onClick={() => shiftMonth(-1)}>‹</button>
              <span className="month-label">{monthLabel}</span>
              <button onClick={() => shiftMonth(1)}>›</button>
            </div>
            <button className="xlsx-btn" onClick={exportLedgerXlsx} title="이번 달 거래내역 엑셀 다운로드">⬇ 엑셀</button>
          </div>
        </div>

        <div className="summary-card">
          <button className="total-toggle" onClick={() => setShowTotalSummary((v) => !v)}>
            <span className="tt-label">💰 총지출</span>
            <span className="tt-right">
              {!showTotalSummary && <span className="tt-preview">{won(monthTotal)}</span>}
              <span className="ct-chevron">{showTotalSummary ? '접기 −' : '펼치기 ＋'}</span>
            </span>
          </button>

          {showTotalSummary && (
            <div className="total-detail">
              <div className="total-detail-row main">
                <span>총지출</span><b>{won(monthTotal)}</b>
              </div>
              <div className="total-detail-row">
                <span>📌 고정비</span><span>{won(fixedTotal)} <em>{fixedPct}%</em></span>
              </div>
              <div className="total-detail-row">
                <span>💳 변동비</span><span>{won(variableTotal)} <em>{variablePct}%</em></span>
              </div>

              {catTotals.length > 0 ? (
                <CategoryBreakdown segments={catTotals} total={monthTotal} centerLabel="카테고리" />
              ) : (
                <div className="empty-state" style={{ padding: '16px 0' }}>
                  <div className="es-text">이 달 분류된 지출이 없어요</div>
                </div>
              )}
            </div>
          )}

          <div className="summary-delta" style={{ marginTop: showTotalSummary ? 12 : 4 }}>
            분류 완료 {monthTxns.filter(t => t.status === 'done').length}건
            {monthTxns.some(t => t.status === 'pending') &&
              <span className="up"> · 미분류 {monthTxns.filter(t => t.status === 'pending').length}건</span>}
          </div>
        </div>
      </div>

      {/* 월별 변동비 지출요약 (고정비 제외, 항상 표시) */}
      <div className="section">
        <div className="section-title" style={{ marginBottom: 12 }}>월별 변동비 지출요약</div>
        <div className="summary-card">
          {catTotalsVariable.length > 0 ? (
            <React.Fragment>
              <div className="total-detail-row main" style={{ marginBottom: 12 }}>
                <span>💳 변동비 합계</span><b>{won(variableTotal)}</b>
              </div>
              <CategoryBreakdown segments={catTotalsVariable} total={variableTotal} centerLabel="변동비" />
            </React.Fragment>
          ) : (
            <div className="empty-state" style={{ padding: '20px 0' }}>
              <div className="es-text">이 달 변동비 지출이 없어요</div>
            </div>
          )}
        </div>
      </div>

      {/* 지출 캘린더 (평소 접힘) */}
      <div className="section">
        <button className="calendar-toggle" onClick={() => setShowCalendar((v) => !v)}>
          <span className="ct-label">📅 지출 캘린더 요약</span>
          <span className="ct-chevron">{showCalendar ? '접기 −' : '펼치기 ＋'}</span>
        </button>

        {showCalendar && (
          <div className="calendar-card">
            <div className="cal-grid cal-weekdays">
              {['일', '월', '화', '수', '목', '금', '토'].map((w, i) => (
                <div key={i} className={'cal-wd ' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '')}>{w}</div>
              ))}
            </div>
            {calWeeks.map((week, wi) => (
              <div key={wi} className="cal-grid cal-week">
                {week.map((cell, ci) => cell ? (
                  <button key={ci} className={'cal-cell ' + (cell.total > 0 ? 'has' : '')}
                    onClick={() => { if (cell.total > 0) setCalDay(cell.key); else setManualDate(cell.key); }}>
                    <span className="cc-day">{cell.day}</span>
                    {cell.total > 0 && <span className="cc-amt">{shortWon(cell.total)}</span>}
                  </button>
                ) : <div key={ci} className="cal-cell empty" />)}
              </div>
            ))}
            <div className="cal-hint">금액이 있는 날짜는 내역 보기 · 빈 날짜는 바로 입력할 수 있어요</div>
          </div>
        )}
      </div>

      {/* 카테고리 필터 */}
      <div className="section">
        <div className="filter-chips">
          <button className={'chip ' + (filter === '전체' ? 'active' : '')} onClick={() => setFilter('전체')}>전체</button>
          {pendingCount > 0 && (
            <button className={'chip chip-pending ' + (filter === '미분류' ? 'active' : '')} onClick={() => setFilter('미분류')}>
              <span className="chip-dot" style={{ background: 'var(--gold)' }} />미분류
              <span className="chip-count">{pendingCount}</span>
            </button>
          )}
          {categories.map((c) => (
            <button key={c.key} className={'chip ' + (filter === c.label ? 'active' : '')} onClick={() => setFilter(c.label)}>
              <span className="chip-dot" style={{ background: c.color }} />{c.label}
            </button>
          ))}
        </div>
      </div>

      {/* 거래 리스트 */}
      <div className="section">
        {groups.length === 0 ? (
          <div className="empty-state">
            <div className="es-icon">🧾</div>
            <div className="es-text">해당하는 거래가 없어요</div>
          </div>
        ) : groups.map((g) => (
          <div key={g.key} className="day-group">
            <div className="day-header">
              <span className="day-date">{g.label}</span>
              <span className="day-total">{won(g.total)}</span>
            </div>
            <div className="txn-list">
              {g.items.map((t) => {
                const dt = parseDT(t.datetime);
                const isCancel = t.type === '취소';
                const isPending = t.status === 'pending';
                const color = t.category ? (catColor[t.category] || '#888') : 'var(--gold)';
                return (
                  <div key={t.id} className={'txn-item ' + (isPending ? 'pending' : '')}
                    onClick={() => setDetailId(t.id)}>
                    <div className="txn-icon" style={{ background: (t.category ? color : 'var(--gold)') + '22', color: t.category ? color : 'var(--gold)' }}>
                      {initial(t.merchant)}
                    </div>
                    <div className="txn-main">
                      <div className="txn-merchant">
                        {t.merchant}
                        {isPending && <span className="pending-tag">미분류</span>}
                        {isCancel && <span className="cancel-tag">취소</span>}
                      </div>
                      <div className="txn-sub">
                        <span>{dt.hhmm}</span>
                        <span className="dot-sep">·</span>
                        <span>{t.cardLast4 ? `카드 ${t.cardLast4}` : '현금'}</span>
                      </div>
                      {t.memo ? (
                        <div className="txn-memo">📝 {t.memo}</div>
                      ) : (
                        <div className="txn-memo add-hint">＋ 메모 추가</div>
                      )}
                    </div>
                    <div className="txn-right">
                      <div className={'txn-amount ' + (isCancel ? 'cancel' : '')}>
                        {isCancel ? '-' : ''}{won(t.amount)}
                      </div>
                      <span className="txn-cat-badge"
                        onClick={(e) => { e.stopPropagation(); setEditing({ id: t.id, rect: e.currentTarget.getBoundingClientRect() }); }}>
                        <span className="cb-dot" style={{ background: color }} />
                        {t.category || '분류하기'} ▾
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>

      {/* 인라인 카테고리 수정 팝오버 */}
      {editing && (
        <CatEditPopover
          categories={categories}
          current={(transactions.find((x) => x.id === editing.id) || {}).category}
          anchorRect={editing.rect}
          onPick={(label) => { onEditCat(editing.id, label); setEditing(null); }}
          onClose={() => setEditing(null)}
        />
      )}

      {/* FAB */}
      <div className="fab">
        <button className="fab-btn" onClick={() => setShowManual(true)}>
          <span className="fab-plus">+</span> 수동 입력
        </button>
      </div>

      {(showManual || manualDate) && (
        <ManualSheet categories={categories}
          initialDate={manualDate}
          onSave={(t) => { onAddManual(t); setShowManual(false); setManualDate(null); }}
          onClose={() => { setShowManual(false); setManualDate(null); }} />
      )}

      {detailId && (
        <TxnDetailSheet
          txn={transactions.find((x) => x.id === detailId)}
          categories={categories}
          onSaveMemo={(memo) => onEditMemo(detailId, memo)}
          onSaveAmount={(amount) => onEditAmount(detailId, amount)}
          onSaveMerchant={(merchant) => onEditMerchant(detailId, merchant)}
          onSaveDate={(datetime) => onEditDate(detailId, datetime)}
          onPickCat={(label) => onEditCat(detailId, label)}
          onDelete={onDeleteTxn}
          onClose={() => setDetailId(null)} />
      )}

      {showCatMgr && (
        <CategoryManagerSheet
          categories={categories}
          colorPalette={colorPalette}
          onRename={onRenameCategory}
          onRecolor={onRecolorCategory}
          onDelete={onDeleteCategory}
          onAdd={onAddCategory}
          onToggleFixed={onToggleFixedCategory}
          onClose={() => setShowCatMgr(false)} />
      )}

      {calDay && (
        <DayDetailPopup
          dayKey={calDay}
          transactions={monthTxns}
          categories={categories}
          onItemClick={(id) => setDetailId(id)}
          onAddForDay={(day) => { setCalDay(null); setManualDate(day); }}
          onClose={() => setCalDay(null)} />
      )}
    </div>
  );
}

/* ================= 예산 탭 ================= */
function BudgetTab({
  transactions, categories, budgets, incomes, colorPalette, onSetBudget, onSetIncome,
  onEditCat, onEditMemo, onEditAmount, onEditMerchant, onEditDate, onAddManual, onDeleteTxn,
  onRenameCategory, onRecolorCategory, onDeleteCategory, onToggleFixedCategory, onAddCategory,
}) {
  const now = new Date();
  const [ym, setYm] = useState(`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`);
  const [editing, setEditing] = useState(null); // 편집 중 카테고리 label (인라인 ✎)
  const [draft, setDraft] = useState('');
  const [showIncome, setShowIncome] = useState(false); // 수익금액 접이식
  const [editIncomeCat, setEditIncomeCat] = useState(null); // 편집 중인 수익 카테고리
  const [showFixed, setShowFixed] = useState(false); // 고정비 접이식
  const [showCatMgr, setShowCatMgr] = useState(false); // 변동비 카테고리+예산 통합 관리 시트
  const [showFixedMgr, setShowFixedMgr] = useState(false); // 고정비 전용 관리 시트 (이름/추가/삭제)
  const [catTxnPopup, setCatTxnPopup] = useState(null); // 클릭한 카테고리 label (내역 팝업)
  const [detailId, setDetailId] = useState(null); // 내역 팝업 안에서 클릭한 거래 (수정 시트)
  const catColor = useCatColor(categories);

  const INCOME_CATS = ['급여', '기타소득'];
  const incomeByCat = useMemo(() => {
    const m = {};
    incomes.filter((i) => i.month === ym).forEach((i) => { m[i.category] = i; });
    return m;
  }, [incomes, ym]);
  const totalIncome = INCOME_CATS.reduce((s, c) => s + (incomeByCat[c]?.amount || 0), 0);

  // 변동비 / 고정비 분리 — 예산 사용률·요약은 변동비만 대상으로 계산
  const variableCats = categories.filter((c) => !c.isFixed);
  const fixedCats = categories.filter((c) => c.isFixed);

  const monthLabel = `${ym.slice(0, 4)}년 ${parseInt(ym.slice(5), 10)}월`;
  const shiftMonth = (d) => {
    const [y, m] = ym.split('-').map(Number);
    const nd = new Date(y, m - 1 + d, 1);
    setYm(`${nd.getFullYear()}-${String(nd.getMonth() + 1).padStart(2, '0')}`);
  };

  const spentByCat = useMemo(() => {
    const m = {};
    transactions.forEach((t) => {
      if (t.status !== 'done' || !t.category) return;
      if (parseDT(t.datetime).ym !== ym) return;
      m[t.category] = (m[t.category] || 0) + signedAmount(t);
    });
    return m;
  }, [transactions, ym]);

  const limitByCat = useMemo(() => {
    const m = {};
    budgets.filter((b) => b.month === ym).forEach((b) => { m[b.category] = b.limit; });
    return m;
  }, [budgets, ym]);

  // 변동비: 예산 금액 높은 순 내림차순 (예산 미설정 카테고리는 0원 취급되어 맨 뒤로)
  const rows = variableCats
    .map((c) => {
      const limit = limitByCat[c.label] || 0;
      const spent = spentByCat[c.label] || 0;
      return { ...c, limit, spent, ratio: limit > 0 ? spent / limit : 0 };
    })
    .sort((a, b) => (b.limit - a.limit) || (b.spent - a.spent));

  // 고정비: 지출 많은 순 내림차순
  const fixedRows = fixedCats
    .map((c) => ({ ...c, spent: spentByCat[c.label] || 0 }))
    .sort((a, b) => b.spent - a.spent);
  const fixedTotal = fixedRows.reduce((s, r) => s + r.spent, 0);

  const totalLimit = rows.reduce((s, r) => s + r.limit, 0);
  const totalSpent = rows.reduce((s, r) => s + r.spent, 0);
  const totalRatio = totalLimit > 0 ? totalSpent / totalLimit : 0;
  const remainTotal = totalLimit - totalSpent;

  const barColor = (ratio) => (ratio >= 1 ? 'var(--danger)' : ratio >= 0.8 ? '#E0A82E' : 'var(--success)');
  const pct = (ratio) => Math.round(ratio * 100);

  const startEdit = (label) => { setEditing(label); setDraft(String(limitByCat[label] || '')); };
  const commit = (label) => {
    const v = parseInt((draft || '').replace(/[^0-9]/g, ''), 10) || 0;
    onSetBudget(ym, label, v);
    setEditing(null);
  };

  const catTxnColor = catTxnPopup ? (catColor[catTxnPopup] || '#888') : null;
  const detailTxn = detailId ? transactions.find((x) => x.id === detailId) : null;

  // 카테고리별 내역 팝업에서 "＋ 항목 추가" — 현재 조회 중인 월(ym) 안의 날짜로 생성
  const addCategoryItem = (merchant, amount, memo) => {
    const now2 = new Date();
    const [y, m] = ym.split('-').map(Number);
    const isCurrentMonth = y === now2.getFullYear() && m === now2.getMonth() + 1;
    const dt = isCurrentMonth ? now2 : new Date(y, m - 1, 15, 12, 0, 0);
    const pad = (x) => String(x).padStart(2, '0');
    const iso = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}:00`;
    onAddManual({
      id: 'manual_' + Date.now(),
      merchant, amount, category: catTxnPopup, datetime: iso,
      cardLast4: null, type: '승인', status: 'done', memo,
    });
  };

  const exportBudgetXlsx = () => {
    const budgetRows = rows.map((r) => ({
      '카테고리': r.label,
      '예산': r.limit,
      '지출': r.spent,
      '사용률(%)': r.limit > 0 ? Math.round(r.ratio * 100) : '',
      '남은금액': r.limit - r.spent,
    }));
    const fixedRowsXlsx = fixedRows.map((r) => ({ '고정비 항목': r.label, '지출': r.spent }));
    const incomeRows = INCOME_CATS.map((c) => ({
      '수익 항목': c,
      '금액': incomeByCat[c]?.amount || 0,
      '메모': incomeByCat[c]?.memo || '',
    }));
    downloadXlsx(`예산_${ym}.xlsx`, [
      { name: '변동비예산', rows: budgetRows },
      { name: '고정비', rows: fixedRowsXlsx },
      { name: '수익', rows: incomeRows },
    ]);
  };

  return (
    <div>
      {/* 수익금액 (접이식) */}
      <div className="section">
        <button className="calendar-toggle" onClick={() => setShowIncome((v) => !v)}>
          <span className="ct-label">💰 수익금액 <span className="fixed-total-inline income">{won(totalIncome)}</span></span>
          <span className="ct-chevron">{showIncome ? '접기 −' : '펼치기 ＋'}</span>
        </button>
        {showIncome && (
          <div className="calendar-card fixed-card">
            <div className="fixed-list">
              {INCOME_CATS.map((cat) => {
                const inc = incomeByCat[cat];
                return (
                  <button key={cat} className="fixed-row" onClick={() => setEditIncomeCat(cat)}>
                    <span className="fixed-name">
                      {cat === '급여' ? '💼' : '➕'} {cat}
                      {inc?.memo ? <span className="income-memo"> · {inc.memo}</span> : null}
                    </span>
                    <span className="fixed-amt">{won(inc?.amount || 0)} <span className="fixed-arrow">✎</span></span>
                  </button>
                );
              })}
            </div>
          </div>
        )}
      </div>

      <div className="section">
        <div className="section-head">
          <div className="section-title">예산 요약</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div className="month-nav">
              <button onClick={() => shiftMonth(-1)}>‹</button>
              <span className="month-label">{monthLabel}</span>
              <button onClick={() => shiftMonth(1)}>›</button>
            </div>
            <button className="xlsx-btn" onClick={exportBudgetXlsx} title="이번 달 예산 엑셀 다운로드">⬇ 엑셀</button>
          </div>
        </div>

        {/* 전체 예산 요약 */}
        <div className="summary-card">
          <div className="budget-total-top">
            <div>
              <div className="summary-label">{monthLabel} 변동비 예산 대비</div>
              <div className="budget-total-amount">
                <span className="bt-spent">{won(totalSpent)}</span>
                <span className="bt-limit"> / {fmt(totalLimit)}원</span>
              </div>
            </div>
            <div className={'budget-pct-badge ' + (totalRatio >= 1 ? 'over' : totalRatio >= 0.8 ? 'warn' : '')}>
              {pct(totalRatio)}%
            </div>
          </div>
          <div className="br-bar big">
            <div className="br-fill" style={{ width: Math.min(100, totalRatio * 100) + '%', background: barColor(totalRatio) }} />
          </div>
          <div className="budget-total-sub">
            {remainTotal >= 0
              ? <>이번 달 <b>{fmt(remainTotal)}원</b> 더 쓸 수 있어요</>

            {fixedRows.length > 0 ? (

      {/* 카테고리별 예산 리스트 (변동비, 지출 많은 순, 2열) */}

        <div className="section-head">
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div className="section-title">카테고리별 예산</div>
            <button className="cat-mgr-btn" onClick={() => setShowCatMgr(true)}>⚙ 카테고리</button>
          </div>
        </div>
        <div className="budget-list">
          {rows.map((r) => (
            <div key={r.key} className="budget-row">
              <div className="br-head">
                <span className="br-name"><span className="cat-dot" style={{ background: r.color }} />{r.label}</span>
              </div>
              {editing === r.label ? (
                <span className="br-edit">
                  <input autoFocus inputMode="numeric" value={draft ? fmt(parseInt(draft.replace(/[^0-9]/g, ''), 10) || 0) : ''}
                    placeholder="예산액" onChange={(e) => setDraft(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') commit(r.label); if (e.key === 'Escape') setEditing(null); }} />
                  <button onClick={() => commit(r.label)}>확인</button>
                </span>
              ) : r.limit > 0 ? (
                <span className="br-amount" onClick={() => startEdit(r.label)}>
                  <b>{fmt(r.spent)}</b> / {fmt(r.limit)}원 <span className="br-edit-ic">✎</span>
                </span>
              ) : (
                <button className="br-setbtn" onClick={() => startEdit(r.label)}>＋ 예산 설정</button>
              )}
              {r.limit > 0 && (
                <>
                  <div className="br-bar">
                    <div className="br-fill" style={{ width: Math.min(100, r.ratio * 100) + '%', background: barColor(r.ratio) }} />
                  </div>
                  <div className="br-sub">
                    <span style={{ color: barColor(r.ratio) }}>{pct(r.ratio)}%</span>
                    <span>{r.limit - r.spent >= 0 ? `${fmt(r.limit - r.spent)}원 남음` : `${fmt(r.spent - r.limit)}원 초과`}</span>
                  </div>
                </>
              )}
            </div>
          ))}
        </div>
      </div>

      {showCatMgr && (
        <CategoryManagerSheet
          categories={categories}
          colorPalette={colorPalette}
          onRename={onRenameCategory}
          onRecolor={onRecolorCategory}
          onDelete={onDeleteCategory}
          onAdd={onAddCategory}
          onToggleFixed={onToggleFixedCategory}
          filterFixed={false}
          budgetMode
          limitByCat={limitByCat}
          onSetBudget={(label, limit) => onSetBudget(ym, label, limit)}
          onClose={() => setShowCatMgr(false)} />
      )}

      {showFixedMgr && (
        <CategoryManagerSheet
          categories={categories}
          colorPalette={colorPalette}
          onRename={onRenameCategory}
          onRecolor={onRecolorCategory}
          onDelete={onDeleteCategory}
          onAdd={onAddCategory}
          onToggleFixed={onToggleFixedCategory}
          filterFixed={true}
          onClose={() => setShowFixedMgr(false)} />
      )}

      {editIncomeCat && (
        <IncomeEditSheet
          category={editIncomeCat}
          amount={incomeByCat[editIncomeCat]?.amount}
          memo={incomeByCat[editIncomeCat]?.memo}
          onSave={(amount, memo) => onSetIncome(ym, editIncomeCat, amount, memo)}
          onClose={() => setEditIncomeCat(null)} />
      )}

      {catTxnPopup && (
        <CategoryTxnPopup
          category={catTxnPopup}
          color={catTxnColor}
          ym={ym}
          transactions={transactions.filter((t) => parseDT(t.datetime).ym === ym)}
          onItemClick={(id) => setDetailId(id)}
          onAddItem={addCategoryItem}
          onDeleteItem={onDeleteTxn}
          onClose={() => setCatTxnPopup(null)} />
      )}

      {detailTxn && (
        <TxnDetailSheet
          txn={detailTxn}
          categories={categories}
          onSaveMemo={(memo) => onEditMemo(detailId, memo)}
          onSaveAmount={(amount) => onEditAmount(detailId, amount)}
          onSaveMerchant={(merchant) => onEditMerchant(detailId, merchant)}
          onSaveDate={(datetime) => onEditDate(detailId, datetime)}
          onPickCat={(label) => onEditCat(detailId, label)}
          onDelete={onDeleteTxn}
          onClose={() => setDetailId(null)} />
      )}
    </div>
  );
}

/* ================= 대출 상세 오버레이 (대출내역 + 입출금내역 + 메모) ================= */
function LoanDetailOverlay({ loan, onSaveMemo, onClose }) {
  const [memo, setMemo] = useState(loan.memo || '');
  const fmtDate = (iso) => (iso || '').replace(/-/g, '.');
  const saveAndClose = () => { onSaveMemo(memo.trim()); onClose(); };

  const rows = [
    ['대출상품', loan.name],
    ['대출일', fmtDate(loan.startDate)],
    ['대출만기일', fmtDate(loan.endDate)],
    ['대출잔액', won(loan.remainingBalance)],
    ['대출금리', `연 ${loan.rate}%`],
    ['이자납입방법', loan.paymentMethod],
    ['이자납입일', `${loan.paymentDay}일`],
    ['이자납입계좌', loan.paymentAccount],
  ];

  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) saveAndClose(); }}>
      <div className="modal loan-modal">
        <div className="loan-modal-title">{loan.name} 대출현황</div>

        <div className="loan-section-label">대출내역</div>
        <div className="loan-table">
          {rows.map(([k, v]) => (
            <div key={k} className="loan-table-row">
              <span className="loan-table-key">{k}</span>
              <span className="loan-table-val">{v}</span>
            </div>
          ))}
        </div>

        <div className="loan-section-label">입출금내역</div>
        <div className="loan-history-scroll">
          <table className="loan-history-table">
            <thead>
              <tr><th>거래일</th><th>실거래금액</th><th>거래원금</th><th>정상이자</th></tr>
            </thead>
            <tbody>
              {(loan.history || []).map((h, i) => (
                <tr key={i}>
                  <td>{(h.date || '').replace(/-/g, '.')}</td>
                  <td>{fmt(h.actualAmount)}원</td>
                  <td>{fmt(h.principal)}원</td>
                  <td>{fmt(h.interest)}원</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div className="field" style={{ marginTop: 16 }}>
          <label className="field-label">메모</label>
          <textarea className="memo-textarea" rows={2} maxLength={80}

        </div>

        <button className="close-btn" style={{ marginTop: 14 }} onClick={saveAndClose}>저장하고 닫기</button>
      </div>
    </div>
  );
}

/* ================= 보유카드 관리 시트 ================= */
function CardManagerSheet({ cards, onAdd, onRename, onDelete, onSetMain, onClose }) {
  const [drafts, setDrafts] = useState({});
  const [newName, setNewName] = useState('');

  const nameOf = (c) => (drafts[c.key] !== undefined ? drafts[c.key] : c.name);
  const setDraft = (key, v) => setDrafts((d) => ({ ...d, [key]: v }));
  const commit = (c) => {
    const v = (drafts[c.key] !== undefined ? drafts[c.key] : c.name).trim();
    if (v && v !== c.name) onRename(c.key, v);
    setDrafts((d) => { const n = { ...d }; delete n[c.key]; return n; });
  };
  const addNew = () => { const v = newName.trim(); if (!v) return; onAdd(v); setNewName(''); };

  return (
    <div className="sheet-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet">
        <div className="sheet-handle" />
        <div className="sheet-title">보유카드 관리</div>

        <div className="catmgr-list">
          {cards.map((c) => (
            <div key={c.key} className="catmgr-card">
              <div className="catmgr-row">
                <input className="catmgr-name" value={nameOf(c)} maxLength={12}
                  onChange={(e) => setDraft(c.key, e.target.value)}
                  onBlur={() => commit(c)}
                  onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
                <button className="catmgr-del" title="삭제" onClick={() => onDelete(c.key)}>✕</button>
              </div>
              <div className="catmgr-row2">
                <button className={'catmgr-fixed ' + (c.isMain ? 'active' : '')} onClick={() => onSetMain(c.key)}>
                  {c.isMain ? '⭐ 주카드' : '주카드로 설정'}
                </button>
              </div>
            </div>
          ))}
          {cards.length === 0 && (
            <div className="empty-state" style={{ padding: '20px 0' }}>
              <div className="es-text">등록된 카드가 없어요</div>
            </div>
          )}
        </div>

        <div className="catmgr-add">
          <input value={newName} maxLength={12} placeholder="새 카드 이름 (예: 현대카드)"
            onChange={(e) => setNewName(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') addNew(); }} />
          <button onClick={addNew}>＋ 추가</button>
        </div>

        <div className="sheet-actions">
          <button className="btn-save" onClick={onClose}>완료</button>
        </div>
      </div>
    </div>
  );
}

/* ================= 부채 탭 ================= */
function DebtTab({
  debts, cards, cardBills,
  onEditLoanMemo, onAddCard, onRenameCard, onDeleteCard, onSetMainCard,
  onAddCardBill, onEditCardBill, onDeleteCardBill,
}) {
  const now = new Date();
  const [ym, setYm] = useState(`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`);
  const monthLabel = `${ym.slice(0, 4)}년 ${parseInt(ym.slice(5), 10)}월`;
  const shiftMonth = (d) => {
    const [y, m] = ym.split('-').map(Number);
    const nd = new Date(y, m - 1 + d, 1);
    setYm(`${nd.getFullYear()}-${String(nd.getMonth() + 1).padStart(2, '0')}`);
  };

  const [showLoans, setShowLoans] = useState(false);
  const [loanDetailId, setLoanDetailId] = useState(null);
  const [showCardMgr, setShowCardMgr] = useState(false);
  const [editingBillId, setEditingBillId] = useState(null);
  const [billDraftDay, setBillDraftDay] = useState('');
  const [billDraftAmt, setBillDraftAmt] = useState('');
  const [addingBill, setAddingBill] = useState(false);
  const [newBillCard, setNewBillCard] = useState(cards[0]?.name || '');
  const [newBillDay, setNewBillDay] = useState('');
  const [newBillAmt, setNewBillAmt] = useState('');

  const totalDebt = debts.reduce((s, d) => s + d.remainingBalance, 0);
  const monthBills = cardBills.filter((b) => b.month === ym).sort((a, b) => b.expectedAmount - a.expectedAmount);
  const totalBills = monthBills.reduce((s, b) => s + b.expectedAmount, 0);

  const startEditBill = (b) => { setEditingBillId(b.id); setBillDraftDay(String(b.dueDate)); setBillDraftAmt(String(b.expectedAmount)); };
  const commitBill = (b) => {
    const day = Math.min(31, Math.max(1, parseInt(billDraftDay, 10) || b.dueDate));
    const amt = parseInt((billDraftAmt || '').replace(/[^0-9]/g, ''), 10) || 0;
    onEditCardBill(b.id, { dueDate: day, expectedAmount: amt });
    setEditingBillId(null);
  };

  const submitNewBill = () => {
    const amt = parseInt((newBillAmt || '').replace(/[^0-9]/g, ''), 10) || 0;
    const day = Math.min(31, Math.max(1, parseInt(newBillDay, 10) || 1));
    if (!newBillCard || amt <= 0) return;
    onAddCardBill(newBillCard, ym, day, amt);
    setNewBillDay(''); setNewBillAmt(''); setAddingBill(false);
  };

  const exportDebtXlsx = () => {
    const loanRows = debts.map((d) => ({
      '대출상품': d.name, '대출일': d.startDate, '대출만기일': d.endDate,
      '대출잔액': d.remainingBalance, '대출금리(%)': d.rate,
      '이자납입방법': d.paymentMethod, '이자납입일': d.paymentDay, '이자납입계좌': d.paymentAccount,
      '메모': d.memo || '',
    }));
    const historyRows = [];
    debts.forEach((d) => (d.history || []).forEach((h) => {
      historyRows.push({ '대출상품': d.name, '거래일': h.date, '실거래금액': h.actualAmount, '거래원금': h.principal, '정상이자': h.interest });
    }));
    const billRows = monthBills.map((b) => ({ '카드사': b.cardName, '결제일': b.dueDate, '결제예정금액': b.expectedAmount }));
    downloadXlsx(`부채_${ym}.xlsx`, [
      { name: '대출내역', rows: loanRows },
      { name: '대출입출금내역', rows: historyRows },
      { name: '카드결제예정', rows: billRows },
    ]);
  };

  return (
    <div>
      {/* 요약 */}
      <div className="section">
        <div className="section-head">
          <div className="section-title">부채 요약</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div className="month-nav">
              <button onClick={() => shiftMonth(-1)}>‹</button>
              <span className="month-label">{monthLabel}</span>
              <button onClick={() => shiftMonth(1)}>›</button>
            </div>
            <button className="xlsx-btn" onClick={exportDebtXlsx} title="부채 내역 엑셀 다운로드">⬇ 엑셀</button>
          </div>
        </div>
        <div className="summary-card">
          <div className="debt-summary-row">
            <div>
              <div className="summary-label">총 대출잔액</div>
              <div className="debt-summary-amt">{won(totalDebt)}</div>
            </div>
            <div style={{ textAlign: 'right' }}>
              <div className="summary-label">{monthLabel} 카드결제 예정</div>
              <div className="debt-summary-amt">{won(totalBills)}</div>
            </div>
          </div>
        </div>
      </div>

      {/* 대출원리금 */}
      <div className="section">
        <button className="calendar-toggle" onClick={() => setShowLoans((v) => !v)}>
          <span className="ct-label">🏦 대출원리금 <span className="fixed-total-inline">{won(totalDebt)}</span></span>
          <span className="ct-chevron">{showLoans ? '접기 −' : '펼치기 ＋'}</span>
        </button>
        {showLoans && (
          <div className="calendar-card fixed-card">
            {debts.length > 0 ? (
              <div className="fixed-list">
                {debts.map((d) => (
                  <button key={d.id} className="loan-row" onClick={() => setLoanDetailId(d.id)}>
                    <div className="loan-row-main">
                      <div className="loan-row-name">{d.name}</div>
                      <div className="loan-row-sub">연 {d.rate}% · {d.paymentDay}일 자동이체</div>
                    </div>
                    <div className="loan-row-right">
                      <div className="loan-row-amt">{won(d.remainingBalance)}</div>
                      <span className="fixed-arrow">상세보기 ›</span>
                    </div>
                  </button>
                ))}
              </div>
            ) : (
              <div className="empty-state" style={{ padding: '16px 0' }}>
                <div className="es-text">등록된 대출이 없어요</div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* 카드사별 결제예정금액 */}
      <div className="section">
        <div className="section-head">
          <div className="section-title">카드사별 결제예정금액</div>
          <button className="cat-mgr-btn" onClick={() => setShowCardMgr(true)}>⚙ 보유카드 수정</button>
        </div>

        <div className="card-bill-list">
          {monthBills.map((b) => (
            <div key={b.id} className="card-bill-row">
              {editingBillId === b.id ? (
                <div className="cbill-edit">
                  <span className="cbill-name">{b.cardName}</span>
                  <input className="cbill-day-input" inputMode="numeric" maxLength={2}
                    value={billDraftDay}
                    onChange={(e) => setBillDraftDay(e.target.value.replace(/[^0-9]/g, ''))} />
                  <span className="cbill-day-suffix">일</span>
                  <input className="cbill-amt-input" inputMode="numeric"
                    value={billDraftAmt ? fmt(parseInt(billDraftAmt.replace(/[^0-9]/g, ''), 10) || 0) : ''}
                    onChange={(e) => setBillDraftAmt(e.target.value)} />
                  <button className="cbill-confirm" onClick={() => commitBill(b)}>확인</button>
                </div>
              ) : (
                <>
                  <span className="cbill-text">
                    <b>{b.cardName}</b> {b.dueDate}일 <span className="cbill-amt">{won(b.expectedAmount)}</span>
                  </span>
                  <span className="cbill-actions">
                    <button onClick={() => startEditBill(b)}>수정</button>
                    <button className="danger" onClick={() => onDeleteCardBill(b.id)}>삭제</button>
                  </span>
                </>
              )}
            </div>
          ))}
          {monthBills.length === 0 && (
            <div className="empty-state" style={{ padding: '20px 0' }}>
              <div className="es-text">{monthLabel}에 등록된 카드 결제예정이 없어요</div>
            </div>
          )}
        </div>

        {addingBill ? (
          <div className="cbill-add-form">
            <select className="cbill-select" value={newBillCard} onChange={(e) => setNewBillCard(e.target.value)}>
              {cards.map((c) => <option key={c.key} value={c.name}>{c.name}</option>)}
            </select>
            <input inputMode="numeric" placeholder="일" className="cbill-day-input" maxLength={2}
              value={newBillDay} onChange={(e) => setNewBillDay(e.target.value.replace(/[^0-9]/g, ''))} />
            <input inputMode="numeric" placeholder="금액" className="cbill-amt-input"
              value={newBillAmt ? fmt(parseInt(newBillAmt.replace(/[^0-9]/g, ''), 10) || 0) : ''}
              onChange={(e) => setNewBillAmt(e.target.value)} />
            <button className="cbill-confirm" onClick={submitNewBill}>추가</button>
            <button className="cancel-x" onClick={() => setAddingBill(false)}>✕</button>
          </div>
        ) : (
          <button className="br-setbtn" style={{ marginTop: 10 }} onClick={() => setAddingBill(true)}>＋ 결제예정 추가</button>
        )}
      </div>

      {loanDetailId && (
        <LoanDetailOverlay
          loan={debts.find((d) => d.id === loanDetailId)}
          onSaveMemo={(memo) => onEditLoanMemo(loanDetailId, memo)}
          onClose={() => setLoanDetailId(null)} />
      )}

      {showCardMgr && (
        <CardManagerSheet
          cards={cards}
          onAdd={onAddCard}
          onRename={onRenameCard}
          onDelete={onDeleteCard}
          onSetMain={onSetMainCard}
          onClose={() => setShowCardMgr(false)} />
      )}
    </div>
  );
}

  { key: 'food',   label: '식자재',   icon: '🥦' },

];

// 유통기한 D-Day 계산: 지남/당일=danger(빨강), D-3 이하=warn(노랑), 그 외=safe(표시 안함)
function dDayInfo(expiryDate) {
  if (!expiryDate) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const exp = new Date(expiryDate + 'T00:00:00');
  const diffDays = Math.round((exp - today) / 86400000);
  if (diffDays < 0) return { text: `D+${-diffDays}`, level: 'danger' };
  if (diffDays === 0) return { text: 'D-Day', level: 'danger' };
  if (diffDays <= 3) return { text: `D-${diffDays}`, level: 'warn' };
  return { text: `D-${diffDays}`, level: 'safe' };
}

/* ---- 노션(Notion) 연동 구조 ----
   ⚠️ 중요: Notion API는 브라우저(클라이언트)에서 직접 호출할 수 없음
   (CORS 차단 + API 키를 정적 사이트 JS에 넣으면 그대로 노출됨).
   실제 연동 시에는 반드시 서버리스 함수(예: Cloudflare Worker, Vercel Function)를
   프록시로 두고, NOTION_PROXY_ENDPOINT를 그 프록시 주소로 교체해야 함.
   지금(1단계 목업)은 DEMO_MODE=true라 실제 전송 없이 지연만 흉내냄.
   ---------------------------------------------------------- */
const DEMO_MODE = true;
const NOTION_PROXY_ENDPOINT = '/api/notion-export'; // TODO: 2단계에서 실제 프록시 URL로 교체

// 노션 API 페이지 생성 요청 바디 구조 (Notion "페이지 생성" 스펙에 맞춘 형태)
function buildNotionPayload(ym, summary) {
  return {
    parent: { database_id: 'NOTION_DATABASE_ID' }, // TODO: 실제 데이터베이스 ID로 교체
    properties: {
      '월': { title: [{ text: { content: `${ym} 가계부 정산` } }] },
      '총지출': { number: summary.totalSpend },
      '고정비': { number: summary.fixedTotal },
      '변동비': { number: summary.variableTotal },
      '총수익': { number: summary.totalIncome },
      '저축액': { number: summary.savings },
      '변동비예산잔액': { number: summary.remainBudget },
      '카드결제예정': { number: summary.totalCardBills },
    },
    children: [
      { object: 'block', type: 'paragraph', paragraph: { rich_text: [{ text: { content: summary.reportText } }] } },
    ],
  };
}

async function notionApiRequest(payload) {
  const res = await fetch(NOTION_PROXY_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error('Notion 전송 실패: ' + res.status);
  return res.json();
}

// 복붙용 월말 정산 리포트 텍스트 생성
function buildReportText(ym, summary, catTotalsVariable, cardBillRows) {
  const monthLabel = `${ym.slice(0, 4)}년 ${parseInt(ym.slice(5), 10)}월`;
  const lines = [];
  lines.push(`📊 ${monthLabel} 가계부 정산`);
  lines.push('');
  lines.push(`총지출: ${won(summary.totalSpend)} (고정비 ${fmt(summary.fixedTotal)} · 변동비 ${fmt(summary.variableTotal)})`);
  lines.push(`총수익: ${won(summary.totalIncome)}`);
  lines.push(`이번 달 잔여 금액: ${won(summary.savings)}`);
  lines.push(`남은 변동비 예산: ${won(summary.remainBudget)} (예산 ${fmt(summary.totalBudgetLimit)}원 중 ${fmt(summary.variableTotal)}원 사용, ${summary.budgetUsedPct}%)`);
  lines.push('');
  lines.push('[변동비 카테고리 비중]');
  catTotalsVariable.forEach((s) => {
    const pct = summary.variableTotal > 0 ? Math.round((s.value / summary.variableTotal) * 100) : 0;
    lines.push(`${s.label} ${pct}% · ${fmt(s.value)}원`);
  });
  lines.push('');
  lines.push('[카드 결제 예정]');
  cardBillRows.forEach((b) => lines.push(`${b.cardName} ${b.dueDate}일 ${fmt(b.expectedAmount)}원`));
  lines.push(`총 ${fmt(summary.totalCardBills)}원`);
  return lines.join('\n');
}

/* ---- 노션 내보내기 / 월말 리포트 시트 ---- */
function NotionExportSheet({ ym, summary, catTotalsVariable, cardBillRows, onClose }) {
  const [status, setStatus] = useState('idle'); // idle | loading | success | error
  const [copied, setCopied] = useState(false);
  const reportText = useMemo(
    () => buildReportText(ym, summary, catTotalsVariable, cardBillRows),
    [ym, summary, catTotalsVariable, cardBillRows]
  );

  const send = async () => {
    setStatus('loading');
    try {
      const payload = buildNotionPayload(ym, { ...summary, reportText });
      if (DEMO_MODE) {
        await new Promise((resolve) => setTimeout(resolve, 900)); // 데모: 실제 전송 없이 지연만 흉내
      } else {
        await notionApiRequest(payload);
      }
      setStatus('success');
    } catch (e) {
      setStatus('error');
    }
  };

  const copyText = async () => {
    try {
      await navigator.clipboard.writeText(reportText);
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    } catch (e) {
      // 클립보드 권한이 없는 환경 대비 폴백
      const ta = document.createElement('textarea');
      ta.value = reportText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    }
  };

  return (
    <div className="sheet-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet notion-sheet">
        <div className="sheet-handle" />
        <div className="sheet-title">📝 Notion 내보내기 미리보기</div>
        <pre className="notion-preview">{reportText}</pre>

        {status === 'success' && <div className="notion-status success">✓ Notion으로 전송됐어요</div>}
        {status === 'error' && <div className="notion-status error">전송 실패 — 프록시 서버 연결을 확인해주세요</div>}
        {DEMO_MODE && status === 'idle' && (
          <div className="notion-status demo">⚠ 지금은 목업 단계라 실제 Notion 전송은 시뮬레이션만 해요 (2단계에서 백엔드 프록시 연결 예정)</div>
        )}

        <div className="sheet-actions">
          <button className="btn-cancel" onClick={copyText}>{copied ? '✓ 복사됨' : '📋 텍스트 복사'}</button>
          <button className="btn-save" onClick={send} disabled={status === 'loading'}>
            {status === 'loading' ? '전송 중…' : 'Notion으로 보내기'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---- 월별 지출 추이 막대그래프 (최근 4개월) ---- */
function MonthlyTrendChart({ transactions, ym }) {
  const months = useMemo(() => {
    const [y, m] = ym.split('-').map(Number);
    const arr = [];
    for (let i = 3; i >= 0; i--) {
      const d = new Date(y, m - 1 - i, 1);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      const total = transactions
        .filter((t) => t.status === 'done' && parseDT(t.datetime).ym === key)
        .reduce((s, t) => s + signedAmount(t), 0);
      arr.push({ key, label: `${d.getMonth() + 1}월`, total });
    }
    return arr;
  }, [transactions, ym]);

  const maxTotal = Math.max(1, ...months.map((m) => m.total));

  return (
    <div className="trend-chart">
      {months.map((m) => (
        <div key={m.key} className="trend-col">
          <div className="trend-val">{m.total > 0 ? shortWon(m.total) : ''}</div>
          <div className="trend-bar-track">
            <div className={'trend-bar ' + (m.key === ym ? 'current' : '')}
              style={{ height: `${Math.max(4, (m.total / maxTotal) * 100)}%` }} />
          </div>
          <div className="trend-label">{m.label}</div>
        </div>
      ))}
    </div>
  );
}
